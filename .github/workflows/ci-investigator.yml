name: CI investigator checks
on:
  push:
    paths: ['ci-investigator/**', '.github/workflows/ci-investigator.yml']
  pull_request:
    paths: ['ci-investigator/**', '.github/workflows/ci-investigator.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci-investigator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
